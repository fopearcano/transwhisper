[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-lan-stt"
version = "0.1.0"
description = "CLI microphone recording and LAN transcription via Whisper.cpp."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "voice-lan-stt contributors"},
]
keywords = ["whisper-cpp", "whisper", "speech-to-text", "lan", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]
dependencies = [
    "numpy>=1.24",
    "requests>=2.31",
    "sounddevice>=0.4.6",
    "scipy>=1.10",
]

[project.optional-dependencies]
clipboard = [
    "pyperclip>=1.8.2",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.8.0",
]
gui = [
    "PySide6>=6.6",
]

[project.scripts]
voice-lan-stt = "voice_lan_stt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
